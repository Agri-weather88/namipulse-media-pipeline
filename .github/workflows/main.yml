name: Test Namipulse Pipeline

on:
  push:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Test database
        run: |
          python -c "from app.database import initialize_database; initialize_database(); print('DATABASE OK')"

      - name: Test collector
        run: |
          python -c "from app.collector import collect_all; print(collect_all())"
